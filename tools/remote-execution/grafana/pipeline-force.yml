steps:
  - label: ":grafana: publish NativeLink dashboards & Prometheus config"
    key: "publish-nativelink-grafana"
    if: build.branch == "main" && build.pull_request.id == null
    command: "bash tools/remote-execution/grafana/publish.sh"
    agents:
      queue: "nativelink-grafana"
    concurrency: 1
    concurrency_group: "mono-nativelink-grafana"
    retry:
      automatic: false
