id: format/rust
mode: declarative
runtime: declarative-v1
api_version: v1
# Bazel may legitimately wait for its shared server lock. Two minutes preserves
# that behavior while still surfacing a wedged server as a failed check.
limits:
  timeout_ms: 120000
applies_to:
  - "**/*.rs"

# Binary resolution:
#   - In a Bazel workspace (mono CI): the hermetic rustfmt from rules_rust is used
#     automatically. The channel (stable or nightly) depends on rustfmt_version in
#     MODULE.bazel. Currently this repo pins rustfmt_version = "1.95.0" (stable).
#   - In non-Bazel repos or local dev: the fallback `path: "rustfmt"` uses whatever
#     rustfmt is on PATH, and the framework warns loudly on stderr so you know the
#     hermetic toolchain was skipped.
#   - Missing rustfmt: the framework converts the spawn failure to a check error
#     finding — the process does not crash.
needs:
  rustfmt:
    default:
      bazel: "@rules_rust//tools/upstream_wrapper:rustfmt"
    fallback:
      path: "rustfmt"

invocations:
  - id: format
    run: rustfmt
    mode: per_file
    args:
      # --check: exit 0 when the file is already formatted, exit 1 when it needs
      # reformatting. Works on both stable and nightly rustfmt without any
      # unstable-features flag.
      - "--check"
      # -l: print the names of files that need reformatting to stdout (one per
      # line). Combined with exit 1, this lets the linelist transform distinguish
      # "file needs formatting" (stdout non-empty) from operational errors like
      # parse failures (stdout empty, still exit 1).
      - "-l"
      # --config-path={{repo_root}} pins discovery to the repo root regardless of
      # where checkleft is invoked from, preventing user-level ~/.config/rustfmt/
      # from leaking into CI. The repo must have a rustfmt.toml at its root (with
      # `edition` set). {{repo_root}} is expanded by the declarative framework to
      # the absolute path of the repository root at invocation time.
      - "--config-path={{repo_root}}"
      - "{{file}}"
    # With --check, rustfmt exits 0 when the file is already formatted; exit 1 means
    # either violations (file paths on stdout via -l) or an operational error (no
    # stdout). The linelist transform distinguishes these two cases.
    exit:
      "0": ok
      "1": findings
      default: error
    transform:
      kind: linelist
      message: "file needs rustfmt formatting"
      remediations:
        - "If `checkleft fix` cannot resolve it, run `cargo fmt` to reformat, or apply the expected diff shown by `rustfmt --check {{input.file}}`."
    fix:
      # Drop --check and -l; rustfmt writes the file in place and exits 0 on success.
      # --config-path pin is kept so the repo's rustfmt.toml governs the rewrite.
      # Mode inherits per_file from the parent invocation — one process per file.
      #
      # --config=skip_children=true: the fix sandbox stages only the fixable set
      # (WritableSandbox::stage, tools/checkleft/src/fix/safety.rs:91-125), so a
      # target file's `mod foo;` declarations may point at siblings that were never
      # staged. Without this flag rustfmt tries to resolve and format the whole
      # reachable module tree and hard-aborts when a sibling is missing from disk.
      # Any bytes it would produce for those siblings are discarded by copy_back's
      # airlock anyway (safety.rs:190-196), since only the staged file can be
      # written back — so skipping them costs nothing and avoids a guaranteed abort.
      # skip_children is unstable but honoured via CLI --config= override on the
      # pinned stable toolchain (rustfmt 1.9.0-stable on rustc 1.95.0); see the
      # hermetic regression test guarding against a future toolchain closing that
      # loophole. Check invocation above is intentionally left untouched — do not
      # add this flag there, it would narrow read scope for no gain.
      args:
        - "--config-path={{repo_root}}"
        - "--config=skip_children=true"
        - "{{file}}"
      exit:
        "0": ok
        default: error
