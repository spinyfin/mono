id: format/bazel
mode: declarative
runtime: declarative-v1
api_version: v1
# Building buildifier on a cold Bazel cache and a shared-server lock can take
# several minutes; retain a bounded check-wide allowance for both.
limits:
  timeout_ms: 600000
include:
  - "**/BUILD"
  - "**/BUILD.bazel"
  - "**/*.bzl"
  - "**/*.star"
  - "**/WORKSPACE"
  - "**/WORKSPACE.bazel"
  - "**/MODULE.bazel"

needs:
  buildifier:
    default:
      bazel: "@buildifier_prebuilt//:buildifier"

invocations:
  - id: format
    run: buildifier
    mode: batch
    args:
      - "--mode=check"
      - "--format=json"
      - "{{files}}"
    exit:
      "0": findings
      default: error
    transform:
      kind: json
      select: ".files[] | select(.formatted == false)"
      finding:
        path: "{{item.filename}}"
        message: "file needs buildifier formatting"
        severity: warning
        remediations:
          - "If `checkleft fix` cannot resolve it, run `buildifier {{item.filename}}` to auto-format."
    fix:
      # -mode=fix rewrites each file in place; exits 0 on success.
      args:
        - "-mode=fix"
        - "{{files}}"
      exit:
        "0": ok
        default: error
