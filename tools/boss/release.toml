# Product record for the Boss.app GitHub Release.
#
# Version arithmetic, skip/idempotency, notes, draft creation, checksum
# sidecars, and publish live in //tools/release. This file is the only
# per-product input that file consumes. `{version}` in asset names expands
# to the version encoded in the tag (tag minus tag_prefix), so the published
# zip stays `Boss-1.0.N.zip` — the exact name UpdateChecker resolves.
repo = "spinyfin/mono"
tag_prefix = "boss-v"
title_prefix = "Boss"
change_paths = ["tools/boss/", ".buildkite/steps/boss-release.sh", ".buildkite/pipeline.yml"]
required_assets = ["Boss-{version}.zip"]
optional_assets = []

[version]
scheme = "patch-counter"
major_minor = "1.0"

[notes]
source = "changelog"
project = "tools/boss/PROJECT.yaml"

# A failed run leaves its draft behind. The next scheduled run on the same
# commit resumes it, at most `scheduled_resume_attempts` times (default 3).
#
# `in_flight_minutes` is how long a draft is assumed to still be building
# after a run last worked on it. Boss's prepare, build, upload and publish all
# run in the one `boss-release` job, and that step has a concurrency limit of
# one, so a second release job cannot start until the first has finished. A
# draft a later job finds was therefore left behind, never still in progress,
# and can be resumed or abandoned at once. Raise this above the longest build
# if the release is ever split across jobs.
[recovery]
in_flight_minutes = 0
