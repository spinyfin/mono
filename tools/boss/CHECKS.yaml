checks:
  - id: rust/giant-structs
    config:
      builder: bon
      # Grandfathered files containing structs with 6+ named fields and no bon::Builder.
      # `exclude_files` skips the WHOLE file: any giant struct in a listed file — including
      # ones added later — is never examined. That is the wrong tool for grandfathering
      # existing violations, so this list is intentionally tiny. Prefer `exclude_structs`
      # (below): the file stays in scope and only the named legacy structs are exempt, so a
      # NEW giant struct in the same file is still flagged.
      #
      # Paths are relative to this CHECKS.yaml's directory (tools/boss/).
      #
      # The sole remaining entry is `cli/src/main.rs`, whose giant structs are clap
      # `#[derive(Parser/Args)]` command definitions. syn cannot tell those apart from
      # ordinary structs yet, so the whole file stays excluded until the separate
      # "clap args exempt by default" chore lands clap detection — at which point this
      # `exclude_files` list should disappear entirely.
      exclude_files:
        - cli/src/main.rs
      # Grandfathered struct violations, scanned-but-exempt. The file is still parsed, so a
      # NEW giant struct added alongside any of these is flagged (this is how the
      # `CreateAttentionInput` miss — see T<n> — is now caught). TODO: convert each to
      # `#[derive(bon::Builder)]` and delete its entry.
      #
      # Entry forms:
      #   "StructName"                   — simple name, scoped to this CHECKS.yaml's subtree
      #                                    (tools/boss/). A same-named struct elsewhere in the
      #                                    repo is NOT exempted.
      #   "relative/path.rs::StructName" — qualified, resolved relative to this file's directory
      #                                    (tools/boss/). Exempts that struct only in that exact
      #                                    file, so a same-named struct in another file is still
      #                                    flagged. This is the form used by entries migrated off
      #                                    `exclude_globs` (T<n>/T<n>): it exempts exactly the
      #                                    known-existing violation and nothing more.
      exclude_structs:
        # Migrated off exclude_globs (qualified per-file form). Each line is the exact giant
        # struct that existed in that file when it was grandfathered; new giant structs in
        # these files are now flagged. host_adapter.rs, settings.rs, and worker_registry.rs
        # were dropped from exclude_globs without replacement — they have zero current
        # violations (the structs that earned the exclude have since been migrated/removed).
        - bossctl/src/main.rs::MetricRow
        - client/src/lib.rs::Discovery
        - engine/core/src/audit.rs::StartContext
        - github_tracker/src/lib.rs::UpstreamItem
        - engine/core/src/host_registry.rs::Host
        - engine/core/src/live_status_loop.rs::SlotDebugSnapshot
        - engine/core/src/live_status_loop.rs::DispatcherStatsSnapshot
        - engine/core/src/live_status_loop.rs::SlotConfig
        - protocol/src/engine_app.rs::SpawnWorkerPaneInput
        - protocol/src/live_status_debug.rs::LiveStatusDebugReport
        - protocol/src/live_status_debug.rs::DispatcherStatsReport
        - protocol/src/live_status_debug.rs::LiveStatusSlotDebug
        - protocol/src/live_worker_state.rs::LiveWorkerState
    policy:
      severity: error
      allow_bypass: true

  # Durable guard against reintroducing the NSException-raising legacy
  # `NSFileHandle` convenience APIs into the diagnostic writers under
  # `app-macos/Sources` (`TerminalLoopLog`, `StallLog`,
  # `PopulationTimingLog`, `IpcLog`, `SpawnDiagnosticsLog`). All three —
  # `FileHandle.write(_:)`, `closeFile`, and `seekToEndOfFile` — raise an
  # uncatchable-from-Swift `NSFileHandleOperationException` on a failing
  # syscall (e.g. `ENOSPC`/`EIO` on a full disk) instead of throwing, which
  # is exactly the crash shape behind the terminal-loop livelock incident
  # (Boss v1.0.427). `DiagnosticWrite` wraps all three with non-throwing,
  # Swift-error-catching equivalents (`append`, `closeQuietly`,
  # `openForAppending`); this check exists so a *new* diagnostic writer (or
  # a regression in an existing one) reintroducing a raw call is caught at
  # push time instead of silently reopening the same crash class.
  #
  # A fourth pattern bans `FileHandle(forWritingAtPath:)`, which opens
  # without `O_APPEND`; a following `seekToEnd()`+`write()` is two
  # syscalls, so concurrent appenders (the app and the engine on the same
  # log) can compute the same offset and splice records. This is a
  # different failure mode from the NSException crash class above — it's
  # a data-corruption bug, not a crash — but the fix is the same
  # `DiagnosticWrite.openForAppending(atPath:)` call, so it lives in this
  # check alongside the other three.
  #
  # `closeFile`/`seekToEndOfFile`/`FileHandle(forWritingAtPath:` are
  # unambiguous — no other unrelated Swift API in this repo shares those
  # shapes. The `write` pattern is narrower: it matches only a single
  # *unlabeled* argument (e.g. `write(lineData)`), which is
  # `FileHandle.write(_:)`'s exact call shape; it does not match a
  # `write(contentsOf: ...)` call (the safe throwing API this check steers
  # callers toward) or a `write(to: ...)` call (`Data`'s unrelated,
  # already-safe throwing API), both of which take a labeled first argument.
  #
  # `applies_to` scopes the whole check to Swift files: `FileHandle` is a
  # Foundation (Swift-only) API, so these are raw text patterns that can
  # otherwise false-positive on unrelated languages (e.g. a Rust string
  # literal embedding a Python `sys.stdout.write(...)` call matched
  # `filehandle-write-unlabeled` and pointed at Swift remediation text that
  # made no sense there).
  - id: boss/no-legacy-filehandle-write-api
    check: text/forbidden-pattern
    policy:
      severity: warning
      changed_lines_only: true
    config:
      applies_to:
        - "**/*.swift"
      surfaces:
        - files
      patterns:
        - name: filehandle-close-file
          pattern: '\.closeFile\(\)'
          message: "The legacy FileHandle closeFile method raises an uncatchable NSException on a failing close(2). Use DiagnosticWrite.closeQuietly(_:) instead (see tools/boss/app-macos/Sources/Diagnostics/DiagnosticWrite.swift)."
          severity: warning
        - name: filehandle-seek-to-end-of-file
          pattern: '\.seekToEndOfFile\(\)'
          message: "The legacy FileHandle seekToEndOfFile method raises an uncatchable NSException on a failing lseek(2). Use DiagnosticWrite.openForAppending(atPath:) instead, which opens O_APPEND so there is no separate seek step to fail (see tools/boss/app-macos/Sources/Diagnostics/DiagnosticWrite.swift)."
          severity: warning
        - name: filehandle-write-unlabeled
          pattern: '\.write\(\s*[A-Za-z_][A-Za-z0-9_]*\s*\)'
          message: "FileHandle.write(_:) raises an uncatchable NSException on a failing write(2). Use DiagnosticWrite.append(_:to:site:warned:) instead (see tools/boss/app-macos/Sources/Diagnostics/DiagnosticWrite.swift)."
          severity: warning
        - name: filehandle-for-writing-at-path
          pattern: 'FileHandle\(forWritingAtPath:'
          message: "FileHandle(forWritingAtPath:) opens without O_APPEND, so a following seekToEnd()+write() is two separate syscalls — concurrent appenders (e.g. the app and the engine on the same log) can compute the same offset and splice each other's records. Use DiagnosticWrite.openForAppending(atPath:) instead, which opens with O_APPEND so the offset lookup and the write are atomic (see tools/boss/app-macos/Sources/Diagnostics/DiagnosticWrite.swift). This warning only applies to append paths — a test constructing a handle to exercise a non-append write/close failure is fine and can be left as-is."
          severity: warning
