[package]
name = "boss-engine-coordinator-chat"
version.workspace = true
edition.workspace = true
workspace = "../../../.."

[dependencies]
async-trait = { workspace = true }
bon = { workspace = true }
boss-acp-client = { path = "../../acp_client" }
boss-agent-host = { path = "../../agent-host" }
boss-backoff = { path = "../../backoff" }
boss-engine-driver-home-retention = { path = "../driver-home-retention" }
boss-engine-utils = { path = "../utils" }
boss-protocol = { path = "../../protocol" }
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread", "time"] }
