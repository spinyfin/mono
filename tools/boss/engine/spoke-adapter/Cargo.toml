[package]
name = "boss-spoke-adapter"
version.workspace = true
edition.workspace = true
workspace = "../../../.."

[dependencies]
boss-tmux = { path = "../../tmux" }
anyhow = { workspace = true }
async-trait = { workspace = true }
bon = { workspace = true }
boss-engine-recovery = { path = "../recovery" }
boss-execution-contracts = { path = "../execution-contracts" }
boss-host-execution = { path = "../host-execution" }
boss-protocol = { path = "../../protocol" }
boss-protocol-spoke = { path = "../../protocol-spoke" }
boss-spoke-custody = { path = "../spoke-custody" }
boss-spoke-stream = { path = "../spoke-stream" }
boss-engine-structured-output = { path = "../structured-output" }
boss-work-db = { path = "../work-db" }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
boss-engine-runtime = { path = "../core/runtime", features = ["test-support"] }
boss-host-enrollment = { path = "../host-enrollment" }
rcgen = { workspace = true }
rustls = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
# test-util enables tokio::time::pause / advance so integration tests can fire
# command deadlines independently of sibling-test CPU contention.
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "test-util"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true }
