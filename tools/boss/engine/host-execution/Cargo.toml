bon = { workspace = true }
boss-engine-driver = { path = "../driver" }
boss-engine-recovery = { path = "../recovery" }
boss-engine-utils = { path = "../utils" }
boss-protocol = { path = "../../protocol" }
boss-protocol-spoke = { path = "../../protocol-spoke" }
git-utils = { path = "../../../../lib/rust/git_utils" }
serde = { workspace = true, features = ["derive"] }
