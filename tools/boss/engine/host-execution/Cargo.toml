[package]
name = "boss-host-execution"
version.workspace = true
edition.workspace = true
workspace = "../../../.."

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bon = { workspace = true }
boss-engine-driver = { path = "../driver" }
boss-engine-structured-output = { path = "../structured-output" }
boss-engine-recovery = { path = "../recovery" }
boss-engine-utils = { path = "../utils" }
boss-protocol = { path = "../../protocol" }
boss-protocol-spoke = { path = "../../protocol-spoke" }
boss-tmux = { path = "../../tmux" }
libc = { workspace = true }
git-utils = { path = "../../../../lib/rust/git_utils" }
workspace-procs = { path = "../../../../lib/rust/workspace_procs" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "time"] }
tracing = { workspace = true }

[dev-dependencies]
boss-engine-recovery-fixtures = { path = "../recovery-fixtures" }
boss-engine-test-git = { path = "../test-git" }
boss-engine-test-process = { path = "../test-process" }
tempfile = { workspace = true }
