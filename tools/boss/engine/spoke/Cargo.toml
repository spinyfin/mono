[package]
name = "boss-spoke"
version.workspace = true
edition.workspace = true
workspace = "../../../.."

[dependencies]
boss-host-execution = { path = "../host-execution" }
anyhow = { workspace = true }
boss-protocol-spoke = { path = "../../protocol-spoke" }
boss-spoke-journal = { path = "../spoke-journal" }
boss-spoke-outbound = { path = "../spoke-outbound" }
clap = { workspace = true, features = ["derive"] }
fs4 = { workspace = true }
libc = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "signal"] }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
boss-host-enrollment = { path = "../host-enrollment" }
boss-host-execution = { path = "../host-execution" }
boss-tmux = { path = "../../tmux" }
prost = { workspace = true }
rcgen = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio-stream = { workspace = true, features = ["net"] }
