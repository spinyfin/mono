# Sourced into a codex worker's tmux session at spawn (see
# `crate::tmux_session_config_for` / `spawn_flow::start_tmux_worker` in
# tools/boss/engine/core), via `source-file -t <session>` — never `-f` on the
# `new-session` command line, because Boss's tmux server is long-lived and
# shared: tmux only reads `-f` when a client's invocation actually starts the
# server, so `-f` on any later `new-session` against an already-running
# server is silently ignored.
#
# Deliberately session-scoped: no `set -g`. `-g` always means "every session
# on the server" regardless of `source-file`'s `-t` target, which would flip
# mouse capture for claude/grok panes too — they already draw and scroll
# their own viewport in-app, so tmux capturing the wheel (and click-drag
# selection, which `mouse on` also captures into copy-mode instead of the
# host terminal's native selection) would be a regression for them. A plain
# `set` without `-g`, run via `source-file -t <session>`, applies to that one
# session only.
#
# codex runs with `--no-alt-screen` and draws no in-app scroll UI of its own;
# it relies on the surrounding terminal's scrollback for the mouse wheel.
# Before tmux that was the host terminal's native buffer. Under tmux, that
# scrollback is tmux's own pane history, which only tmux can scroll — and
# tmux only forwards wheel events to itself, instead of to codex, when
# `mouse` is on.
set mouse on
