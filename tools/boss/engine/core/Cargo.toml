[package]
name = "boss-engine"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/facade.rs"

[features]
test-support = ["boss-engine-runtime/test-support"]

[dependencies]
boss-engine-app = { path = "../app" }
boss-engine-runtime = { path = "runtime" }
anyhow = { workspace = true }
boss-build-info = { path = "../../build-info" }
boss-build-provenance = { path = "../../build-provenance" }
boss-log-files = { path = "../../log-files" }
boss-engine-utils = { path = "../utils" }
clap = { workspace = true, features = ["derive"] }
libc = "0.2"
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

[dev-dependencies]
boss-execution-contracts = { path = "../execution-contracts", features = ["test-support"] }
boss-host-execution = { path = "../host-execution" }
boss-tmux = { path = "../../tmux" }
async-trait = { workspace = true }
boss-editorial = { path = "../editorial" }
boss-engine-attachments = { path = "../attachments" }
boss-engine-planner-validation = { path = "../planner-validation" }
boss-protocol = { path = "../../protocol" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
rusqlite = { workspace = true }
toml = { workspace = true }
boss-client = { path = "../../client" }
tempfile = { workspace = true }
