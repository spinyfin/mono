[package]
name = "boss-engine-runtime"
version = "0.1.0"
edition = "2024"

[lib]
path = "../src/lib.rs"

[features]
test-support = [
  "boss-engine-completion/test-support",
  "boss-engine-dispatch/test-support",
  "boss-engine-live-worker-state/test-support",
  "boss-engine-merge-poller/test-support",
  "boss-execution-contracts/test-support",
  "boss-execution-runner/test-support",
  "boss-work-db/test-support",
  "dep:tempfile",
]

[dependencies]
tempfile = { workspace = true, optional = true }
boss-execution-runner = { path = "../../execution-runner" }
boss-execution-contracts = { path = "../../execution-contracts" }
boss-observation-contracts = { path = "../../observation-contracts" }
boss-engine-storage-values = { path = "../../storage-values" }
boss-work-db = { path = "../../work-db" }
boss-host-execution = { path = "../../host-execution" }
boss-host-enrollment = { path = "../../host-enrollment" }
boss-spoke-hub = { path = "../../spoke-hub" }
boss-task-scope = { path = "../../task-scope" }
anyhow = { workspace = true }
boss-ci-log-reader = { path = "../../ci-log-reader" }
boss-claude-client = { path = "../../../claude_client" }
boss-codex-auth = { path = "../../../codex_auth" }
boss-comment-anchor = { path = "../../../comment_anchor" }
boss-engine-comment-classifier = { path = "../../comment-classifier" }
boss-gh-telemetry = { path = "../../../gh_telemetry" }
boss-github = { path = "../../../github" }
boss-github-tracker = { path = "../../../github_tracker" }
boss-transcript-markdown = { path = "../../transcript-markdown" }
boss-tmux = { path = "../../../tmux" }
boss-worker-processes = { path = "../../../worker-processes" }
boss-engine-automation-schedule = { path = "../../automation-schedule" }
async-trait = { workspace = true }
bon = { workspace = true }
chrono = { workspace = true }
git-utils = { path = "../../../../../lib/rust/git_utils" }
boss-conflict-diagnosis = { path = "../../conflict-diagnosis" }
boss-deterministic-resolvers = { path = "../../deterministic-resolvers" }
boss-dispatch-events = { path = "../../dispatch-events" }
boss-dispatch-reader = { path = "../../dispatch-reader" }
boss-editorial = { path = "../../editorial" }
boss-engine-design-docs = { path = "../../design-docs" }
boss-engine-codex-rollout-retention = { path = "../../codex-rollout-retention" }
boss-engine-completion = { path = "../../completion" }
boss-engine-dispatch = { path = "../../dispatch" }
boss-engine-driver = { path = "../../driver" }
boss-engine-live-worker-state = { path = "../../live-worker-state" }
boss-engine-merge-poller = { path = "../../merge-poller" }
boss-engine-driver-quota = { path = "../../driver-quota" }
boss-engine-attachments = { path = "../../attachments" }
boss-engine-grok-home-retention = { path = "../../grok-home-retention" }
boss-engine-offsite-backup = { path = "../../offsite-backup" }
boss-engine-effort = { path = "../../effort" }
boss-feature-flags = { path = "../../feature-flags" }
boss-engine-gh-invocation = { path = "../../gh-invocation" }
boss-engine-live-status-redact = { path = "../../live-status-redact" }
boss-log-files = { path = "../../../log-files" }
boss-metrics = { path = "../../metrics" }
boss-engine-planner-validation = { path = "../../planner-validation" }
boss-pr-review = { path = "../../pr-review" }
boss-pr-template = { path = "../../pr-template" }
boss-review-guide = { path = "../../review-guide" }
boss-engine-recovery = { path = "../../recovery" }
boss-protocol = { path = "../../../protocol" }
boss-protocol-spoke = { path = "../../../protocol-spoke" }
boss-ssh-transport = { path = "../../ssh-transport" }
boss-timer-wheel = { path = "../../timer-wheel" }
boss-engine-day-rotated-log = { path = "../../day-rotated-log" }
boss-event-bus = { path = "../../event-bus" }
boss-engine-stdout-progress = { path = "../../stdout-progress" }
boss-engine-structured-output = { path = "../../structured-output" }
boss-engine-transient-error = { path = "../../transient-error" }
boss-engine-utility-model = { path = "../../utility-model" }
boss-engine-utils = { path = "../../utils" }
boss-engine-worker-bin = { path = "../../worker-bin" }
boss-transcript-tail = { path = "../../transcript-tail" }
clap = { workspace = true, features = ["derive"] }
libc = "0.2"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tonic = { workspace = true }
tracing = { workspace = true }
shlex = { workspace = true }
rusqlite = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
rustls = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }

boss-command-runner = { path = "../../../command-runner" }
boss-design-doc-fetcher = { path = "../../design-doc-fetcher" }
boss-pr-review-sources = { path = "../../pr-review-sources" }

[dev-dependencies]
boss-engine-completion = { path = "../../completion", features = ["test-support"] }
boss-engine-live-worker-state = { path = "../../live-worker-state", features = ["test-support"] }
boss-engine-merge-poller = { path = "../../merge-poller", features = ["test-support"] }
boss-execution-runner = { path = "../../execution-runner", features = ["test-support"] }
boss-execution-contracts = { path = "../../execution-contracts", features = ["test-support"] }
boss-work-db = { path = "../../work-db", features = ["test-support"] }
boss-prose-vocabulary = { path = "../../prose-vocabulary" }
boss-engine-recovery-fixtures = { path = "../../recovery-fixtures" }
boss-engine-test-git = { path = "../../test-git" }
rcgen = { workspace = true }
tempfile = { workspace = true }
tokio-stream = { workspace = true }
wiremock = { workspace = true }
# test-util enables tokio's virtual-time controls (time::pause / advance,
# #[tokio::test(start_paused = true)]) used by the sweep_loop tests to
# drive the periodic loop deterministically without real sleeps. It is
# deliberately excluded from tokio's "full" feature set, so it must be
# opted into here for the test build.
tokio = { workspace = true, features = ["test-util"] }
