# Product record for the signed boss-spoke GitHub Release.
#
# Version arithmetic, skip/idempotency, notes, draft creation, checksum sidecars
# and publish live in //tools/release; this file is the only per-product input
# it consumes. Each platform contributes five assets: the package, its manifest,
# the detached Ed25519 signature over the manifest, the standalone installer a
# person runs first on a new host, and a detached signature over that installer.
# The installer's digest is also listed in the signed manifest. The `.sha256`
# sidecar `bin/release` adds is an integrity check, not an authenticity
# signature; authenticity is the `.manifest.json.sig` and the installer `.sig`
# against the pinned release key.
#
# change_paths lists the spoke's own crates. Scheduled runs never cut a new
# release from HEAD and never resume a draft: a Boss release (or a manual run)
# creates and builds the draft at the pinned Boss commit.
repo = "spinyfin/mono"
tag_prefix = "boss-spoke-v"
title_prefix = "Boss spoke"
change_paths = [
  "tools/boss/engine/host-execution/",
  "tools/boss/engine/spoke/",
  "tools/boss/engine/spoke-journal/",
  "tools/boss/engine/spoke-outbound/",
  "tools/boss/engine/spoke-preflight/",
  "tools/boss/protocol-spoke/",
  "tools/boss/spoke-package/",
  "tools/boss/spoke-release.toml",
  ".buildkite/steps/spoke-release.sh",
  ".buildkite/pipeline-spoke-release.yml",
  ".buildkite/pipeline-spoke-release-builds.yml",
]
required_assets = [
  "boss-spoke-macos-arm64.tar.gz",
  "boss-spoke-macos-arm64.manifest.json",
  "boss-spoke-macos-arm64.manifest.json.sig",
  "boss-spoke-package-macos-arm64",
  "boss-spoke-package-macos-arm64.sig",
  "boss-spoke-linux-amd64.tar.gz",
  "boss-spoke-linux-amd64.manifest.json",
  "boss-spoke-linux-amd64.manifest.json.sig",
  "boss-spoke-package-linux-amd64",
  "boss-spoke-package-linux-amd64.sig",
  "spoke-packages.macos-arm64.json",
  "spoke-packages.linux-amd64.json",
  "spoke-packages.json",
]
# No Linux arm64 build agent exists yet; the step script already builds it when
# one runs the `build` phase, and `publish` accepts it when present.
optional_assets = [
  "boss-spoke-linux-arm64.tar.gz",
  "boss-spoke-linux-arm64.manifest.json",
  "boss-spoke-linux-arm64.manifest.json.sig",
  "boss-spoke-package-linux-arm64",
  "boss-spoke-package-linux-arm64.sig",
  "spoke-packages.linux-arm64.json",
]

[version]
scheme = "patch-counter"
major_minor = "1.0"

[notes]
source = "github-generated"
