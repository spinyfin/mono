[package]
name = "boss-spoke-package"
version.workspace = true
edition.workspace = true
workspace = "../../.."

[[bin]]
name = "boss-spoke-package"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
bon = { workspace = true }
boss-http-retry = { path = "../http_retry" }
boss-protocol-spoke = { path = "../protocol-spoke" }
boss-spoke-credentials = { path = "../spoke-credentials" }
boss-spoke-preflight = { path = "../engine/spoke-preflight" }
clap = { workspace = true, features = ["derive"] }
flate2 = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
ring = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time"] }
url = { workspace = true }

[dev-dependencies]
boss-host-enrollment = { path = "../engine/host-enrollment" }
rcgen = { workspace = true }
rusqlite = { workspace = true }
rustls = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
