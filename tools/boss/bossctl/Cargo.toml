[package]
name = "bossctl"
version.workspace = true
edition.workspace = true

[[bin]]
name = "bossctl"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bon = { workspace = true }
boss-build-info = { path = "../build-info" }
boss-client = { path = "../client" }
boss-execution-contracts = { path = "../engine/execution-contracts" }
boss-engine = { path = "../engine/core" }
boss-host-enrollment = { path = "../engine/host-enrollment" }
boss-log-files = { path = "../log-files" }
boss-protocol = { path = "../protocol" }
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[dev-dependencies]
rcgen = { workspace = true }
rustls = { workspace = true }
tempfile = { workspace = true }
