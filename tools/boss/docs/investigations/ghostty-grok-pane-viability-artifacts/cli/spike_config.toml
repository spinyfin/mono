[cli]
installer = "internal"

[ui]
permission_mode = "always-approve"
yolo = false

# Disable Claude/Cursor hook pickup so we control hooks ourselves
[compat.claude]
hooks = false
agents = false
skills = false
plugins = false
rules = false

[compat.cursor]
hooks = false
agents = false
skills = false
plugins = false
rules = false

[marketplace]
default_skills_installs_purged = true
official_marketplace_auto_installed = true

[[marketplace.sources]]
name = "xAI Official"
git = "https://github.com/xai-org/plugin-marketplace.git"
