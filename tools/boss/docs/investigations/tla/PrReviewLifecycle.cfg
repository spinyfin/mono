\* Baseline: the incident shape. A burst of activity well inside the
\* one-hour churn window (ChurnWindow > MaxTime, so nothing ages out),
\* and a death class transient_recovery does NOT handle -- i.e. the
\* SlotBusy pane-spawn `failed` path, where pr_review_recovery is the
\* only way back.
\*
\* KindScopedCount = FALSE is main's behaviour. This is the config the
\* blind spec was first checked with.
\*
\* No CONSTRAINT: the bounds are already enforced by the action guards
\* (every Append is gated on Len < MaxExecs, Tick on clock < MaxTime),
\* so a state constraint would be redundant -- and TLC warns that state
\* constraints are unsound when checking liveness.
SPECIFICATION Spec

CONSTANTS
    MaxExecs               = 6
    MaxImpls               = 3
    MaxTime                = 3
    MaxDeaths              = 3
    ChurnWindow            = 10
    ChurnThreshold         = 3
    TransientResumeEnabled = FALSE
    DeathStatuses          = {"orphaned", "failed", "cancelled", "abandoned"}
    KindScopedCount        = FALSE

\* GuardAndCandidateAgreeOnDeath is NOT listed here: it is false in the
\* initial state, so TLC reports it before exploring anything and the
\* behavioural search never runs. It gets its own config,
\* StatusSetConsistency.cfg -- which is itself the finding.
INVARIANTS
    TypeOK
    GuardParksOnlyOnReviewChurn

\* Quiescence is legitimate here: when every execution is terminal and
\* the model bounds are exhausted, no action is enabled. That is not a
\* liveness bug, it is the end of the modelled behaviour.
CHECK_DEADLOCK FALSE
