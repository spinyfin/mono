\* MATCHED PAIR for Control.cfg: identical bounds, KindScopedCount = FALSE.
\*
\* This must VIOLATE GuardParksOnlyOnReviewChurn at exactly the bounds
\* where Control.cfg holds it. Without this pair the control is
\* vacuous: a bound too small to reach the bug at all would also "pass",
\* and would look exactly like the fix working.
SPECIFICATION Spec

CONSTANTS
    MaxExecs               = 6
    MaxImpls               = 3
    MaxTime                = 1
    MaxDeaths              = 3
    ChurnWindow            = 10
    ChurnThreshold         = 3
    TransientResumeEnabled = FALSE
    DeathStatuses          = {"orphaned", "failed", "cancelled", "abandoned"}
    KindScopedCount        = FALSE

INVARIANTS
    TypeOK
    GuardParksOnlyOnReviewChurn

\* Quiescence is legitimate here: when every execution is terminal and
\* the model bounds are exhausted, no action is enabled. That is not a
\* liveness bug, it is the end of the modelled behaviour.
CHECK_DEADLOCK FALSE
