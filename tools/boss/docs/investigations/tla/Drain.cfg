\* Is the park PERMANENT, or a stall bounded by the churn window?
\* ChurnWindow (1) < MaxTime (4): executions age out, so the count can
\* fall back below threshold and the sweep can self-heal
\* (work/dispatch_helpers.rs:1358, :1374).
\* DeathStatuses excludes "cancelled" for the same reason as Liveness.cfg.
SPECIFICATION Spec

CONSTANTS
    MaxExecs               = 5
    MaxImpls               = 3
    MaxTime                = 4
    MaxDeaths              = 3
    ChurnWindow            = 1
    ChurnThreshold         = 3
    TransientResumeEnabled = FALSE
    DeathStatuses          = {"orphaned", "failed", "abandoned"}
    KindScopedCount        = FALSE

PROPERTIES
    ParkingIsNotPermanent

\* Quiescence is legitimate here: when every execution is terminal and
\* the model bounds are exhausted, no action is enabled. That is not a
\* liveness bug, it is the end of the modelled behaviour.
CHECK_DEADLOCK FALSE
