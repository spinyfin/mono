\* The `cancelled` mismatch, isolated.
\*
\* GuardCountedStatuses  (work/dispatch.rs:834, :853) = {orphaned, abandoned, failed}
\* DeadReviewStatuses    (work/dispatch.rs:799)       = {orphaned, abandoned, failed, cancelled}
\*
\* These must agree: a review that dies `cancelled` IS a recovery
\* candidate but is INVISIBLE to the guard that is supposed to rate-limit
\* recovering it. TLC reports this in the initial state -- no behaviour
\* is explored, because none is needed.
SPECIFICATION Spec

CONSTANTS
    MaxExecs               = 6
    MaxImpls               = 3
    MaxTime                = 3
    MaxDeaths              = 3
    ChurnWindow            = 10
    ChurnThreshold         = 3
    TransientResumeEnabled = FALSE
    DeathStatuses          = {"orphaned", "failed", "cancelled", "abandoned"}
    KindScopedCount        = FALSE

INVARIANTS
    GuardAndCandidateAgreeOnDeath

\* Quiescence is legitimate here: when every execution is terminal and
\* the model bounds are exhausted, no action is enabled. That is not a
\* liveness bug, it is the end of the modelled behaviour.
CHECK_DEADLOCK FALSE
