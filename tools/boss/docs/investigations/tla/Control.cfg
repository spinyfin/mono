\* POST-HOC CONTROL, added after the blind run already found the bug.
\*
\* Identical to the baseline except KindScopedCount = TRUE, i.e. the
\* guard counts only pr_review-kind terminal executions. If
\* GuardParksOnlyOnReviewChurn now HOLDS across the whole state space,
\* the invariant is discriminating between two implementations rather
\* than being unsatisfiable -- which is what makes the baseline
\* counterexample evidence of a defect rather than of a bad property.
SPECIFICATION Spec

CONSTANTS
    MaxExecs               = 6
    MaxImpls               = 3
    MaxTime                = 1
    MaxDeaths              = 3
    ChurnWindow            = 10
    ChurnThreshold         = 3
    TransientResumeEnabled = FALSE
    DeathStatuses          = {"orphaned", "failed", "cancelled", "abandoned"}
    KindScopedCount        = TRUE

INVARIANTS
    TypeOK
    GuardParksOnlyOnReviewChurn

\* Quiescence is legitimate here: when every execution is terminal and
\* the model bounds are exhausted, no action is enabled. That is not a
\* liveness bug, it is the end of the modelled behaviour.
CHECK_DEADLOCK FALSE
