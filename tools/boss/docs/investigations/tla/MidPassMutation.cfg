\* Exhibits the TOCTOU window inside pr_review_recovery::run_one_pass.
\* NoMutationMidPass asserts the pass is atomic; it is not, so TLC
\* produces a trace where another sweep mutates work_executions between
\* list_dead_pr_review_candidates and count_recent_terminal_executions.
SPECIFICATION Spec

CONSTANTS
    MaxExecs               = 6
    MaxImpls               = 3
    MaxTime                = 1
    MaxDeaths              = 3
    ChurnWindow            = 10
    ChurnThreshold         = 3
    TransientResumeEnabled = FALSE
    DeathStatuses          = {"orphaned", "failed", "cancelled", "abandoned"}
    KindScopedCount        = FALSE

INVARIANTS
    NoMutationMidPass

CHECK_DEADLOCK FALSE
