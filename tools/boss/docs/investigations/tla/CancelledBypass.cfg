\* The `cancelled` status-set mismatch (Finding 2), as BEHAVIOUR rather
\* than as a constant comparison.
\*
\* Every reaper writes `cancelled`. That status IS in the candidate query's
\* dead set (dispatch.rs:799) but is NOT in the set the churn guard counts
\* (dispatch.rs:834). So the guard's count stays 0 no matter how many
\* reviews die, the guard never trips, and pr_review_recovery re-fires
\* without limit -- precisely the unbounded redispatch loop the guard was
\* added to prevent.
\*
\* GuardParksOnlyOnReviewChurn HOLDS here (the guard never parks at all),
\* which is why this needs its own config: the bug is the guard being
\* inert, not the guard being wrong.
SPECIFICATION Spec

CONSTANTS
    MaxExecs               = 6
    MaxImpls               = 2
    MaxTime                = 1
    MaxDeaths              = 3
    ChurnWindow            = 10
    ChurnThreshold         = 3
    TransientResumeEnabled = FALSE
    DeathStatuses          = {"cancelled"}
    KindScopedCount        = FALSE

INVARIANTS
    GuardParksOnlyOnReviewChurn

PROPERTIES
    ReviewEventuallyLands

CHECK_DEADLOCK FALSE
