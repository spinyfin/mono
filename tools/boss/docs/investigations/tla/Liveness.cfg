\* Does an open PR whose review dies eventually get a ReviewResult?
\* Safety invariants omitted so the temporal check runs to completion
\* instead of being cut short by the safety violation.
\*
\* ChurnWindow (10) > MaxTime (1): nothing ever ages out of the window,
\* modelling a burst of churn inside the real one-hour window.
\* DeathStatuses excludes "cancelled" deliberately. With cancelled in
\* the set, TLC finds a different (also real) counterexample -- see
\* CancelledBypass.cfg -- and the trace stops being about the churn
\* guard at all. Narrowing to the statuses the guard counts is what
\* isolates "the guard parks the review and it never refires".
SPECIFICATION Spec

CONSTANTS
    MaxExecs               = 6
    MaxImpls               = 3
    MaxTime                = 1
    MaxDeaths              = 3
    ChurnWindow            = 10
    ChurnThreshold         = 3
    TransientResumeEnabled = FALSE
    DeathStatuses          = {"orphaned", "failed", "abandoned"}
    KindScopedCount        = FALSE

PROPERTIES
    ReviewEventuallyLands

\* Quiescence is legitimate here: when every execution is terminal and
\* the model bounds are exhausted, no action is enabled. That is not a
\* liveness bug, it is the end of the modelled behaviour.
CHECK_DEADLOCK FALSE
