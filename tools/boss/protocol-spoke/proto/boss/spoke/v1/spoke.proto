// Hub/spoke wire protocol, epoch 1.
//
// A spoke dials the hub over mTLS and holds one SpokeHub.Connect stream for
// its lifetime. The first frame is Hello; the hub answers Welcome (selecting
// one wire epoch and one revision per named feature) or Reject. After that,
// every journaled observation travels as a sequenced Record and every hub
// instruction as a sequenced Command; each side acknowledges the other's
// highest contiguous sequence (Cursor) once it is durable, never before.
//
// Evolution rules (enforced by the checkleft proto/breaking check and the
// semantic peer tests; see ../../../../README.md):
//   - Field numbers and enum numbers are permanent. A removed field or enum
//     value must reserve both its number and its name.
//   - A new field is optional with a documented default; a reader behaves
//     correctly when it is absent. An existing field is never repurposed.
//   - Every enum has an *_UNSPECIFIED = 0 member. A reader treats a number it
//     does not know as "a newer peer sent something I do not understand" and
//     falls back to the most conservative behaviour; it never maps it to
//     success and never panics.
//   - An unset oneof is malformed or newer than the reader, never success.
//   - Incompatible changes get a new feature revision (Feature) or, only for
//     the base envelope, handshake or ack ordering, a new wire epoch.
//
// All IDs are opaque UTF-8 strings except digests, which are 32 raw bytes.
// Scalar zero or empty values are not usable identities: receivers validate
// (boss_protocol_spoke::validate) before acting on anything they decode.

syntax = "proto3";
package boss.spoke.v1;

// The long-lived, spoke-initiated session. Only the hub listens.
service SpokeHub {
  rpc Connect(stream SpokeFrame) returns (stream HubFrame);
}
// Certificate issuance. Enroll is server-authenticated TLS with a single-use
// token; Renew additionally requires the host's current client certificate.
service Enrollment {
  rpc Enroll(EnrollRequest) returns (Certificate);
  rpc Renew(RenewRequest) returns (Certificate);
}
message Empty {}
// A durable position: everything in journal_id up to and including through.
message Cursor {
  string journal_id = 1;
  uint64 through = 2;
}
// Wall time for display and audit, plus same-boot clock counters. Sequence
// numbers, never timestamps, order records; awake_ns excludes suspended time.
message Stamp {
  string boot_id = 1;
  int64 wall_unix_ms = 2;
  uint64 awake_ns = 3;
  uint64 elapsed_ns = 4;
}
message Feature {
  string name = 1;
  uint32 revision = 2;
}
// Identity of one assignment. The hub persists it before any command leaves.
message Run {
  string execution_id = 1;
  string run_id = 2;
  uint64 assignment_generation = 3;
  string spawn_token = 4;
}
// First spoke frame. host_id must equal the host named by the client
// certificate (urn:boss:host:<id>); the certificate authenticates, Hello only
// claims. min_epoch..max_epoch and features drive negotiation, build is
// informational only.
message Hello {
  string host_id = 1;
  string journal_id = 2;
  string boot_id = 3;
  uint32 min_epoch = 4;
  uint32 max_epoch = 5;
  repeated Feature features = 6;
  string build = 7;
  Cursor received_commands = 8;
  uint64 first_retained = 9;
  uint64 last_record = 10;
  Inventory inventory = 11;
  bytes instance_nonce = 12;
}
// The hub's selection for this connection, frozen until reconnect.
// received_records is the hub's durable receipt for the spoke's journal, not the
// spoke's remembered sent watermark; the spoke replays from the next sequence.
message Welcome {
  uint32 epoch = 1;
  repeated Feature features = 2;
  string hub_id = 3;
  string authority_generation = 4;
  uint64 connection_generation = 5;
  Cursor received_records = 6;
  string command_journal_id = 7;
  uint32 max_frame_bytes = 8;
  uint32 max_inflight_bytes = 9;
  string build = 10;
}
// Why a Hello was refused. Its fields never change meaning, so an incompatible
// peer can always read it and learn what to upgrade.
message Reject {
  string code = 1;
  string diagnostic = 2;
  uint32 supported_min_epoch = 3;
  uint32 supported_max_epoch = 4;
}
message Pulse {
  bytes nonce = 1;
  Stamp stamp = 2;
}
// Transport controls (Hello, receipts, pulse replies) are not journaled.
message SpokeFrame {
  oneof body {
    Hello hello = 1;
    Record record = 2;
    Cursor command_receipt = 3;
    Pulse pulse_reply = 4;
  }
}
// connection_generation fences stale streams; it lives outside Command so a
// replayed command keeps its identity and hash on a new stream.
message HubFrame {
  uint64 connection_generation = 6;
  oneof body {
    Welcome welcome = 1;
    Reject reject = 2;
    Command command = 3;
    Cursor record_receipt = 4;
    Pulse pulse = 5;
  }
}
// One journaled spoke observation. run is required for run observations and
// absent for host-scoped bodies (capacity, inventory).
message Record {
  uint64 sequence = 1;
  Stamp observed = 2;
  Run run = 3;
  oneof body {
    CommandResult result = 10;
    WorkerEvent event = 11;
    PaneState pane = 12;
    TranscriptDelta transcript = 13;
    Capacity capacity = 14;
    Proposal proposal = 15;
    ArtifactChunk artifact = 16;
    InventorySnapshot inventory = 17;
    Gap gap = 18;
    PaneCapture capture = 19;
    WorkerRequest request = 20;
  }
}
// One hub instruction with a hub-issued per-host sequence. command_id makes it
// idempotent: a repeat with different bytes is rejected.
message Command {
  uint64 sequence = 1;
  string command_id = 2;
  Run run = 3;
  int64 not_after_unix_ms = 4;
  oneof body {
    Spawn spawn = 10;
    Empty adopt = 11;
    WorkspaceOp workspace = 12;
    Deliver deliver = 13;
    Stop stop = 14;
    ReadArtifact read = 15;
    Capture capture = 16;
    Empty inventory = 17;
    ProposalDecision proposal_decision = 18;
    Upgrade upgrade = 19;
    WorkerReply worker_reply = 20;
  }
}
// Outcome of a Command. OUTCOME_UNCERTAIN means the effect may have happened;
// the hub reconciles rather than blindly retrying.
enum ResultCode {
  RESULT_UNSPECIFIED = 0;
  OK = 1;
  REJECTED = 2;
  ABSENT = 3;
  UNKNOWN = 4;
  OUTCOME_UNCERTAIN = 5;
}
message CommandResult {
  string command_id = 1;
  ResultCode code = 2;
  string reason = 3;
  oneof value {
    PaneState pane = 10;
    WorkspaceResult workspace = 11;
    Empty completed = 12;
  }
}
message Inventory {
  string os = 1;
  string arch = 2;
  repeated string driver_ids = 3;
  string cube_version = 4;
  string tmux_version = 5;
  uint32 configured_slots = 6;
  repeated string failed_preflights = 7;
}
message InventorySnapshot {
  repeated RunObservation runs = 1;
  uint64 through_record = 2;
  uint32 page = 3;
  bool last_page = 4;
}
message RunObservation {
  Run run = 1;
  PaneState pane = 2;
}
// Prompt and settings together are bounded (see limits.rs). The environment is
// restricted to driver-declared variables plus hub-generated run identity, and
// never carries provider or hub credentials.
message Spawn {
  string lease_id = 1;
  string workspace_id = 2;
  string driver_id = 3;
  string model = 4;
  bytes prompt_utf8 = 5;
  bytes settings_json = 6;
  repeated Env env = 7;
  repeated Feature required_features = 8;
  uint32 cpu_millis = 9;
  uint64 memory_bytes = 10;
  bytes run_context_json = 11;
  string context_revision = 12;
  bytes worker_policy_json = 13;
  string policy_revision = 14;
}
message Env {
  string name = 1;
  string value = 2;
}
enum WorkspaceKind {
  WORKSPACE_UNSPECIFIED = 0;
  ENSURE_REPO = 1;
  LEASE = 2;
  RELEASE = 3;
  HEARTBEAT = 4;
  FORCE_RELEASE = 5;
  CREATE_CHANGE = 6;
  GOTO_PR = 7;
  GOTO_REVISION = 8;
  STATUS = 9;
  LIST_WORKSPACES = 10;
  LIST_REPOS = 11;
  CREATE_BOOKMARK = 12;
  DIFF_BOOKMARK = 13;
  RESTORE_BOOKMARK = 14;
  DISCARD_BASELINE = 15;
  RESTORE_REBASED = 16;
  CHECKPOINT_BASELINE = 17;
  PREPARE_RECOVERY_PR = 18;
  RECONCILE_BOOKMARK = 19;
  RELEASE_HEADS = 20;
}
// A discriminated, typed operation, not an argv tunnel: kind selects which
// fields are required and which are forbidden. Paths from a peer are display
// only; workspace IDs resolve in the host's lease registry.
message WorkspaceOp {
  WorkspaceKind kind = 1;
  string repo_id = 2;
  string origin = 3;
  string workspace_id = 4;
  string lease_id = 5;
  string title = 6;
  string task_label = 7;
  bool allow_dirty = 8;
  repeated string exclude_workspace_ids = 9;
  uint64 ttl_seconds = 10;
  uint64 pr_number = 11;
  string revision = 12;
  string reason = 13;
  Bookmark bookmark = 14;
  optional Bookmark predecessor = 15;
  string inherited_base = 16;
  bool self_retry = 17;
  string pr_bookmark = 18;
  string trunk = 19;
}
message Bookmark {
  string repo_id = 1;
  string execution_id = 2;
  string head = 3;
  string recovery = 4;
  string base = 5;
  string anchor_commit = 6;
}
message WorkspaceResult {
  string repo_id = 1;
  string workspace_id = 2;
  string lease_id = 3;
  string display_path = 4;
  string change_id = 5;
  bytes cube_result_json = 6;
  optional Bookmark bookmark = 7;
}
enum DeliveryKind {
  DELIVERY_UNSPECIFIED = 0;
  PROBE = 1;
  INTERRUPT = 2;
  NUDGE = 3;
  ANSWER = 4;
}
message Deliver {
  DeliveryKind kind = 1;
  bytes input_utf8 = 2;
}
message Stop {
  uint32 grace_ms = 1;
}
// ALIVE, EXITED (with exit_code when known), MISSING and INDETERMINATE are
// distinct observations; only the hub's policy gives them work consequences.
enum PaneLife {
  PANE_UNSPECIFIED = 0;
  ALIVE = 1;
  EXITED = 2;
  MISSING = 3;
  INDETERMINATE = 4;
}
message PaneState {
  PaneLife life = 1;
  string session = 2;
  string pane_id = 3;
  uint64 pid = 4;
  optional int32 exit_code = 5;
  uint64 activity_awake_ns = 6;
  string boot_id = 7;
}
// generation is monotonic; applied_command_through is the hub-command prefix the
// spoke has already counted in its reservations.
message Capacity {
  uint64 generation = 1;
  uint32 total_slots = 2;
  uint32 active_slots = 3;
  uint32 reserved_slots = 4;
  uint64 free_disk_bytes = 5;
  uint64 available_memory_bytes = 6;
  uint32 available_cpu_millis = 7;
  double load_one_minute = 8;
  uint64 journal_bytes = 9;
  Inventory inventory = 10;
  uint64 applied_command_through = 11;
}
// Mirrors boss_protocol::WorkerEvent's seven hook variants. Tool values stay
// JSON bytes so plugin-specific objects survive unchanged.
message WorkerEvent {
  string session_id = 1;
  oneof event {
    SessionStart session_start = 10;
    string user_prompt = 11;
    ToolUse pre_tool_use = 12;
    ToolUse post_tool_use = 13;
    TurnStop stop = 14;
    string notification = 15;
    string session_end = 16;
  }
}
enum StartSource {
  START_UNSPECIFIED = 0;
  STARTUP = 1;
  RESUME = 2;
  CLEAR = 3;
  COMPACT = 4;
  OTHER_START = 5;
}
message SessionStart {
  StartSource source = 1;
  optional string model = 2;
}
message ToolUse {
  string name = 1;
  bytes input_json = 2;
  bytes response_json = 3;
}
enum StopReason {
  STOP_UNSPECIFIED = 0;
  COMPLETED = 1;
  AWAITING_INPUT = 2;
  INTERRUPTED = 3;
  OTHER_STOP = 4;
}
// transcript_* carry the watermark a completion consumer waits for.
message TurnStop {
  bool stop_hook_active = 1;
  StopReason reason = 2;
  string transcript_generation = 3;
  uint64 transcript_through = 4;
}
message TranscriptDelta {
  string generation = 1;
  uint64 offset = 2;
  bytes data = 3;
  bytes sha256 = 4;
  bool eof = 5;
}
enum ProposalKind {
  PROPOSAL_UNSPECIFIED = 0;
  PR_CREATED = 1;
  RUN_DONE = 2;
  WAIT = 3;
  QUESTION = 4;
  REVIEW_REPORT = 5;
  REVIEW_VERDICT = 6;
  OTHER_VALIDATED = 7;
}
message Proposal {
  string proposal_id = 1;
  ProposalKind kind = 2;
  string payload_contract = 3;
  bytes canonical_json = 4;
  string transcript_generation = 5;
  uint64 transcript_through = 6;
}
message ProposalDecision {
  string proposal_id = 1;
  ResultCode code = 2;
  string reason = 3;
  bytes result_json = 4;
}
enum WorkerMethod {
  WORKER_METHOD_UNSPECIFIED = 0;
  RUN_CONTEXT = 1;
  PR_STATUS = 2;
  PR_BODY = 3;
  PROPOSAL_STATUS = 4;
}
message WorkerRequest {
  string request_id = 1;
  WorkerMethod method = 2;
  string proposal_id = 3;
}
message WorkerReply {
  string request_id = 1;
  ResultCode code = 2;
  bytes result_json = 3;
  string revision = 4;
  int64 observed_unix_ms = 5;
  string reason = 6;
}
enum ArtifactKind {
  ARTIFACT_UNSPECIFIED = 0;
  REVIEW_RESULT = 1;
  WORKER_LOG = 2;
  SPOKE_LOG = 3;
  PR_URL = 4;
  ATTACHMENT = 5;
}
message ReadArtifact {
  string artifact_id = 1;
  ArtifactKind kind = 2;
  uint64 offset = 3;
  uint32 max_bytes = 4;
}
message ArtifactChunk {
  string artifact_id = 1;
  ArtifactKind kind = 2;
  uint64 offset = 3;
  bytes data = 4;
  bytes sha256 = 5;
  bool eof = 6;
  uint64 total_bytes = 7;
}
message Gap {
  string resource = 1;
  uint64 from_offset = 2;
  uint64 through_offset = 3;
  string reason = 4;
}
message Capture {
  string subscription_id = 1;
  uint32 interval_ms = 2;
  uint32 max_bytes = 3;
  uint32 ttl_seconds = 4;
}
message PaneCapture {
  string subscription_id = 1;
  bytes text_utf8 = 2;
  bool truncated = 3;
}
message Upgrade {
  string release_id = 1;
  string manifest_url = 2;
  bytes manifest_sha256 = 3;
}
message EnrollRequest {
  string host_id = 1;
  string job_id = 2;
  string request_id = 3;
  bytes token = 4;
  bytes csr_der = 5;
}
message RenewRequest {
  string request_id = 1;
  bytes csr_der = 2;
}
message Certificate {
  bytes leaf_der = 1;
  repeated bytes chain_der = 2;
  int64 expires_unix_ms = 3;
  string host_id = 4;
  string serial = 5;
}
