check_definitions:
  exec_paths:
    - tools/checkleft/checks
  allow_override_bundled: true

checks:
  - id: md/link-integrity
    policy:
      severity: warning

  - id: no-generated-artifacts
    check: file/forbidden-path
    policy:
      severity: warning
    config:
      rules:
        - remediation: "Generated build output must not be committed. Remove the artifact from the change."
          when:
            - added
            - modified
            - renamed
          patterns:
            - "**/target/**"
            - "**/node_modules/**"
            - "**/.build/**"
            - "bazel-*"
            - "bazel-*/**"

  - id: file/size
    config:
      max_lines: 3000
      exclude_files:
        # Markdown, lockfiles, and generated files — never check these for size
        - "**/*.md"
        - "**/*.lock"
        - "**/package-lock.json"
        - "**/go.sum"
        - "**/Package.resolved"
        - pnpm-lock.yaml
        - "**/*.pb.rs"
        # Files currently over the 3000-line limit — TODO: split each below 3000
    policy:
      severity: error
      allow_bypass: true

  # Caps how many non-deleted files a single changeset may touch. Threshold
  # (30) sits just above p95 of the last 100 mono PRs; the generic check
  # default is 50 for unconfigured consumers. Legitimate large surfaces
  # (coordinated renames, unsplittable generated trees) use
  # BYPASS_CHANGE_FILE_COUNT=<specific legitimate reason> in the commit
  # description — not a silent higher default. The PR description also works
  # but is a best-effort surface (it requires resolving the PR and GitHub API
  # access); the commit description is read in every CI context, including
  # the merge queue, with no network dependency. Distinct from file/size,
  # which limits lines per file, not file count.
  - id: change/file-count
    config:
      max_files: 30
    policy:
      severity: error
      allow_bypass: true

  - id: format/bazel
    policy:
      severity: error

  - id: lint/bazel
    policy:
      severity: error

  - id: rust-test-rule-coverage
    policy:
      severity: warning

  - id: todo-expiry
    policy:
      severity: warning

  - id: repo-visibility
    policy:
      severity: warning

  - id: md/doc-structure
    check: md/doc-structure
    # Which doc trees this check gates. The check's intrinsic .md extension
    # gate applies on top.
    include:
      - "**/docs/investigations/**/*.md"
      - "**/docs/designs/**/*.md"
    policy:
      severity: error

  # Guards the include-side-unification project (see
  # tools/checkleft/docs/designs/checkleft-unify-the-include-side-of-file-scoping-across-check-implementation-types.md,
  # decision 4): a check must never ship its own top-level answer to "is
  # this file a target of this check at all" — deciding that is the
  # framework's job via the check-entry `include` / `exclude` keys, not the
  # check's own config. Scoped to the two check-authoring surfaces (wasm
  # guest `lib.rs` and built-in Rust checks) with the framework's own
  # `include`, dogfooding the key this project unifies.
  - id: checkleft/no-check-level-file-scoping
    check: checkleft/no-check-level-file-scoping
    include:
      - "tools/checkleft/checks/**/src/lib.rs"
      - "tools/checkleft/src/checks/**/*.rs"
    policy:
      severity: error

  - id: format/oxc
    policy:
      severity: error

  - id: format/rust
    policy:
      severity: error

  - id: lint/rust
    policy:
      severity: error

  - id: lint/oxc
    policy:
      severity: error

  # Deterministic catch for Boss-internal review vocabulary leaking into
  # PR-visible text (title/description) or commit messages — the automated
  # PR reviewer was flagging these downstream on every occurrence, which is
  # exactly the kind of thing a worker can catch itself before ever pushing.
  # See the rubric this mirrors: the `agent_isms` dimension, sub-rules
  # (2)/(3), in `engine/pr-review/src/render.rs`.
  #
  # Scoped to `surfaces: [changeset]` only (PR description + tip commit
  # message), deliberately NOT `files`. Every one of these phrases —
  # `T<n>`/`P<n>` ids, "the operator", "chore", "revision" — is also this
  # codebase's own correct, long-standing internal vocabulary for describing
  # Boss itself (e.g. `boss_construct_scan.rs`'s own doc comments, or the
  # hundreds of pre-existing `// T<n>: ...` provenance comments across
  # engine/core). Scanning file content would flag that legitimate usage
  # everywhere it already exists rather than newly-introduced leaks, and the
  # check has no per-line grandfather mechanism — only a file-level
  # `exclude`, which would have to list most of `engine/core` to stay quiet,
  # defeating the point of a narrow exclusion list. The PR description and
  # tip commit message of a real changeset carry none of that legacy noise,
  # and are exactly the surface the motivating incident was about, so that is
  # where this starts. Intermediate historical commit messages on the branch
  # are intentionally not scanned (checkleft keeps the full range only for
  # BYPASS parsing) so MQ/squash re-embedding of old messages cannot
  # false-fail a PR whose tip + PR body are clean.
  #
  # Declared at the repo root (not under tools/boss/) and with an explicit
  # `scope: changeset` because `scope = changeset` is only honoured in the
  # repo-root CHECKS file — a subdirectory CHECKS.yaml is scheduled per
  # changed file, so a check living under tools/boss/ would only ever run
  # on PRs that touch tools/boss/, leaving every other PR in the repo
  # (including the Boss-worker PRs this check exists to catch) unscanned.
  - id: boss-ism/pr-text-leakage
    check: text/forbidden-pattern
    scope: changeset
    policy:
      severity: error
    config:
      surfaces:
        - changeset
      patterns:
        - name: boss-work-item-id
          # Byte-identical to `BOSS_ID_RE` in
          # `tools/boss/engine/core/src/boss_construct_scan.rs` — enforced by
          # the `boss_ism_checks_yaml_id_pattern_matches_boss_id_re_source`
          # test next to that constant, which fails loudly if the two drift
          # apart.
          pattern: '\b[TP]\d+\b'
          message: "Internal Boss work-item ids (T<n>/P<n>) must not appear in the PR description or commit message."
          severity: error
        - name: boss-operator-reference
          pattern: "(?i)\\bthe operator\\b"
          message: "Do not refer to \"the operator\" in the PR description or commit message; state the reason directly instead of naming who asked for it."
          severity: error
        - name: boss-brief-reference
          pattern: "(?i)\\bper the brief\\b"
          message: "Do not reference \"the brief\" in the PR description or commit message; describe what the change does instead of where the instruction came from."
          severity: warning
        - name: boss-chore-reference
          pattern: "(?i)\\bthis chore\\b"
          message: "Do not reference Boss work-kind vocabulary (\"this chore\") in the PR description or commit message."
          severity: warning
        - name: boss-revision-cycle-reference
          pattern: "(?i)\\brevision cycle\\b"
          message: "Do not reference Boss's internal revision-cycle vocabulary (\"revision cycle\") in the PR description or commit message; describe the change itself."
          severity: warning

  # File-content sibling of boss-ism/pr-text-leakage: catches a leaked Boss
  # work-item id (e.g. a stray provenance comment) landing directly in source,
  # not just PR-visible text. Left at the framework's default `scope: files`
  # (NOT `scope: changeset`) — a changeset-scope run carries no file diffs, so
  # `config.surfaces: [files]` would scan nothing and `changed_lines_only`
  # would silently no-op.
  #
  # Carries only the work-item-id pattern, not the "the operator" / "per the
  # brief" / "this chore" / "revision cycle" patterns from the changeset
  # instance above — those are ordinary English with real hits in file
  # content (source comments, docs) that a file scan can't disambiguate from
  # a leak the way a changeset-text scan can.
  #
  # `policy.changed_lines_only: true` scopes findings to lines the PR itself
  # adds or modifies, so this repo's own hundreds of pre-existing, legitimate
  # `T<n>`/`P<n>` provenance comments (this is Boss's own tracker vocabulary,
  # used correctly throughout engine/core and tools/checkleft) do not need a
  # blanket exclusion — they simply never come up as changed lines. This is a
  # documented no-op under `checkleft run --all` (no hunk data to scope
  # against, so an `--all` run reports every existing occurrence, expected
  # behaviour for a manual full-repo sweep, not a regression).
  #
  # `\d{3,}` floors the id at 3 digits (vs. the changeset instance's
  # unfloored `\d+`) to avoid false positives on new lines this pattern would
  # otherwise catch: ISO-8601 "T" time separators (`2024-01-01T00:00:00`),
  # percentile labels (`P25`/`P75`), and short tie-placement notation. Chosen
  # to match flunge's `boss-ism/file-text-leakage` instance (see
  # brianduff/flunge#1133) for consistency across the two repos.
  #
  # Severity is `warning`, not `error`: unlike a PR description (which is
  # trivial to edit before merge), a false-positive-shaped id landing in a
  # source comment is not worth hard-blocking the push gate over — a human
  # reviewer can weigh in without this becoming red CI.
  - id: boss-ism/file-text-leakage
    check: text/forbidden-pattern
    policy:
      severity: warning
      changed_lines_only: true
    exclude:
      # This file's own tests exercise `BOSS_ID_RE` against literal
      # id-shaped and near-miss fixture strings as their entire purpose —
      # new test cases necessarily add more of them.
      - "tools/boss/engine/core/src/boss_construct_scan.rs"
    config:
      surfaces:
        - files
      patterns:
        - name: boss-work-item-id-floored
          pattern: '\b[TP]\d{3,}\b'
          message: "Internal Boss work-item ids (T<n>/P<n>) must not appear in source. Remove the reference; if provenance is genuinely needed, put it in the PR description instead."
          severity: warning

  # `structured_output_fallback` must always be invoked on the driver the run
  # actually used, resolved via `driver_transcript::driver_for_execution` (or
  # `driver_transcript::driver_or_default` on an already-resolved
  # `Option<&dyn AgentDriver>`). A pool-dispatched execution (review/automation
  # pool) runs a different driver than its own `tasks.driver` column, so a
  # hardcoded `ClaudeDriver` receiver silently discards a valid
  # prose-recovered result whenever the two disagree.
  #
  # The pattern requires the dot to follow `ClaudeDriver` with no intervening
  # `)`, so it does NOT flag the sanctioned fail-safe idiom
  # (`driver_or_default(driver.as_deref()).structured_output_fallback(...)`),
  # where a `)` from `driver_or_default(...)` always separates the two — only
  # a direct, unconditional `ClaudeDriver.structured_output_fallback(` (with no
  # resolution step at all) matches.
  #
  # Known narrow spot: this does not cover a hardcoded `ClaudeDriver` passed as
  # an argument into a forwarder that itself calls `structured_output_fallback`
  # (e.g. `followups_from_driver_fallback(&ClaudeDriver, ..)`). That shape is
  # legitimately sanctioned at `extract_followups_backstop`'s own forwarding
  # call — it parses the utility model's own answer, which is always
  # Claude-shaped regardless of the run's driver — so a pattern matching it
  # would flag correct code, not just the regression this check exists to
  # catch. Enforcing that half requires call-site-aware review, not a text
  # pattern.
  - id: boss-ism/hardcoded-claude-driver-fallback
    check: text/forbidden-pattern
    policy:
      severity: error
      changed_lines_only: false
    config:
      surfaces:
        - files
      patterns:
        - name: hardcoded-claude-driver-structured-output-fallback
          pattern: 'ClaudeDriver\.structured_output_fallback\('
          message: "Do not call ClaudeDriver.structured_output_fallback(...) directly. Resolve the run's actual driver via driver_transcript::driver_for_execution (or driver_transcript::driver_or_default) first — a pool-dispatched or non-Claude-driven execution must not be parsed as if it always ran Claude."
          severity: error

  # git 2.28 (July 2020) introduced flags that pin a repo's first branch at
  # `git init` time. Agents whose git predates that fail with `unknown switch`.
  # The portable two-step is `git init` then `git symbolic-ref HEAD refs/heads/<name>`.
  - id: git/no-init-named-branch-flags
    check: text/forbidden-pattern
    policy:
      severity: error
      changed_lines_only: false
    config:
      surfaces:
        - files
      patterns:
        - name: git-init-initial-branch-flag
          pattern: '-[-]initial-branch'
          message: "Do not pin a git repo's first branch with git 2.28-only init flags. Run `git init` (optionally `-q` / `--bare`) then `git symbolic-ref HEAD refs/heads/<name>`."
          severity: error
        - name: git-init-dash-b-argv
          pattern: '"init"\s*,\s*(?:"(?:-q|--quiet|--bare)"\s*,\s*)*"[-]b"'
          message: "Do not pass `-b` to `git init` (argv form). That flag requires git 2.28+. Run `git init` then `git symbolic-ref HEAD refs/heads/<name>`."
          severity: error
        - name: git-init-dash-b-shell
          pattern: 'init(?:\s+(?:-q|--quiet|--bare))*\s+-b\b'
          message: "Do not pass `-b` to `git init` (shell form). That flag requires git 2.28+. Run `git init` then `git symbolic-ref HEAD refs/heads/<name>`."
          severity: error
