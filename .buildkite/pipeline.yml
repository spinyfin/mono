# Boss/mono Buildkite CI pipeline.
#
# Override queues when testing agents:
#   BUILDKITE_ANY_QUEUE=agent-test
#   BUILDKITE_MACOS_QUEUE=macos-test
#
# timeout_in_minutes on every remote-enabled step is the last bound on a step
# that has stopped making progress, not a performance budget. Bazel 9.1 puts
# no per-RPC deadline on a remote execution call; --grpc_keepalive_time (set
# on ci-remote / ci-remote-linux) drops the transport only if HTTP/2 PINGs go
# unanswered (tools/remote-execution/README.md, "What bounds a stuck action").
# On 2026-11-18 such steps sat for 52 to 75 minutes, until the executor was
# restarted. The verification-step values are about four times the slowest
# passing run of each among 1,800 builds sampled between 2026-09-18 and
# 2026-11-18 (bazel-build-test 16 min, mac-app-build 15 min, checks 8 min), so
# a cold cache does not reach them. boss-release is 90 min: by the time it
# builds, the tag is pushed and the draft exists, and a run that is killed
# there leaves the release waiting for a manual one, but an unbounded hang
# against a frozen hub is worse.

steps:
  - label: ":bazel: bazel-build-test"
    key: "bazel-build-test"
    command: ".buildkite/steps/bazel-build-test.sh"
    timeout_in_minutes: 60
    artifact_paths:
      - "bazel-out/**/extra_action_outputs/**/*"
      - "bazel-testlogs/**/test.log"
      - "bazel-testlogs/**/test.xml"
    agents:
      queue: "${BUILDKITE_ANY_QUEUE:-bazel-any}"
    notify:
      - github_commit_status:
          context: "buildkite/mono/bazel-build-test"

  - label: ":apple: mac-app-build"
    key: "mac-app-build"
    command: ".buildkite/steps/mac-app-build.sh"
    timeout_in_minutes: 60
    agents:
      queue: "${BUILDKITE_MACOS_QUEUE:-macos-arm64}"
    notify:
      - github_commit_status:
          context: "buildkite/mono/mac-app-build"

  - label: ":white_check_mark: checks"
    key: "checks"
    command: ".buildkite/steps/checks.sh"
    timeout_in_minutes: 30
    agents:
      queue: "${BUILDKITE_ANY_QUEUE:-bazel-any}"
    notify:
      - github_commit_status:
          context: "buildkite/mono/checks"

  - label: ":rocket: boss-release"
    key: "boss-release"
    if: build.branch == "main" && (build.source == "schedule" || build.source == "ui" || build.source == "api")
    command: ".buildkite/steps/boss-release.sh"
    timeout_in_minutes: 90
    depends_on:
      - "bazel-build-test"
      - "mac-app-build"
      - "checks"
    agents:
      queue: "${BUILDKITE_MACOS_QUEUE:-macos-arm64}"
    # Serialize manual and scheduled release runs so a scheduled run never
    # races a manual run's in-progress draft; the later run sees the
    # published release and skips as a no-op.
    concurrency: 1
    concurrency_group: "mono-boss-release"
    retry:
      automatic: false
    notify:
      - github_commit_status:
          context: "buildkite/mono/boss-release"
