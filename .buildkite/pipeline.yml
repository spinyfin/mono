# Boss/mono Buildkite CI pipeline.
#
# Override queues when testing agents:
#   BUILDKITE_ANY_QUEUE=agent-test
#   BUILDKITE_MACOS_QUEUE=macos-test
#
# timeout_in_minutes on every remote-enabled step is the last resort on a
# step that has stopped making progress, not a performance budget. The bound
# on a hub that goes silent mid-step is the status watchdog in ci-env.sh
# (tools/remote-execution/README.md, "What bounds a stuck action"). Bazel 9.1
# puts no per-RPC deadline on a remote execution call, and keepalive was
# measured not to end a wait against a stopped hub. On 2026-11-18 such steps
# sat for 52 to 75 minutes, until the executor was restarted. The
# verification-step values are about four times the slowest passing run of
# each among 1,800 builds sampled between 2026-09-18 and 2026-11-18
# (bazel-build-test 16 min, mac-app-build 15 min, checks 8 min), so a cold
# cache does not reach them. boss-release is 90 min: by the time it builds,
# the tag is pushed and the draft exists, and a run that is killed there
# leaves the release waiting for a manual one, but an unbounded hang against
# a frozen hub is worse.

steps:
  # Evaluate changes against the main commit's first parent, not origin/main
  # (which already contains this commit). Explicitly enable agent filtering.
  # Set NATIVELINK_GRAFANA_PUBLISH=1 on a main build to force a catch-up publish.
  - label: ":grafana: select NativeLink publication"
    if: build.branch == "main" && build.pull_request.id == null
    command: |
      if [[ "${NATIVELINK_GRAFANA_PUBLISH:-}" == "1" ]]; then
        buildkite-agent pipeline upload tools/remote-execution/grafana/pipeline-force.yml
      else
        buildkite-agent pipeline upload --apply-if-changed --git-diff-base=HEAD^ tools/remote-execution/grafana/pipeline.yml
      fi
    depends_on:
      - "bazel-build-test"
      - "mac-app-build"
      - "checks"
    agents:
      queue: "${BUILDKITE_ANY_QUEUE:-bazel-any}"

  # Both jobs rendezvous while running, guaranteeing distinct agents; the
  # second waits for the first to populate the cache before invoking Bazel.
  - label: "Boss tag cache: %n"
    if: build.env("BOSS_VERIFY_TAG_CACHE") == "1"
    parallelism: 2
    command: "bash .buildkite/steps/verify-boss-tag-cache.sh"
    artifact_paths:
      - "bazel-execlogs/**/*"
    agents:
      queue: "bazel-any"
      os: "${BOSS_TAG_CACHE_OS:-darwin}"
      arch: "${BOSS_TAG_CACHE_ARCH:-arm64}"

  - label: ":bazel: bazel-build-test"
    key: "bazel-build-test"
    command: ".buildkite/steps/bazel-build-test.sh"
    # Retry infrastructure interruptions once; build/test exits 1 and 2 stay failed.
    retry:
      automatic:
        - exit_status: -1 # agent lost
          limit: 1
        - exit_status: 143 # job killed / SIGTERM
          limit: 1
        - signal_reason: agent_stop
          limit: 1
    timeout_in_minutes: 60
    artifact_paths:
      - "bazel-execlogs/**/*"
      - "bazel-out/**/extra_action_outputs/**/*"
      - "bazel-testlogs/**/test.log"
      - "bazel-testlogs/**/test.xml"
    agents:
      queue: "${BUILDKITE_ANY_QUEUE:-bazel-any}"
    notify:
      - github_commit_status:
          context: "buildkite/mono/bazel-build-test"

  - label: ":apple: mac-app-build"
    key: "mac-app-build"
    command: ".buildkite/steps/mac-app-build.sh"
    # Retry infrastructure interruptions once; build/test exits 1 and 2 stay failed.
    retry:
      automatic:
        - exit_status: -1 # agent lost
          limit: 1
        - exit_status: 143 # job killed / SIGTERM
          limit: 1
        - signal_reason: agent_stop
          limit: 1
    timeout_in_minutes: 60
    artifact_paths:
      - "bazel-execlogs/**/*"
    agents:
      queue: "${BUILDKITE_MACOS_QUEUE:-macos-arm64}"
    notify:
      - github_commit_status:
          context: "buildkite/mono/mac-app-build"

  - label: ":white_check_mark: checks"
    key: "checks"
    command: ".buildkite/steps/checks.sh"
    # Retry infrastructure interruptions once; build/test exits 1 and 2 stay failed.
    retry:
      automatic:
        - exit_status: -1 # agent lost
          limit: 1
        - exit_status: 143 # job killed / SIGTERM
          limit: 1
        - signal_reason: agent_stop
          limit: 1
    timeout_in_minutes: 30
    artifact_paths:
      - "bazel-execlogs/**/*"
    agents:
      queue: "${BUILDKITE_ANY_QUEUE:-bazel-any}"
    notify:
      - github_commit_status:
          context: "buildkite/mono/checks"

  - label: ":rocket: boss-release"
    key: "boss-release"
    if: build.branch == "main" && (build.source == "schedule" || build.source == "ui" || build.source == "api")
    command: ".buildkite/steps/boss-release.sh"
    timeout_in_minutes: 90
    artifact_paths:
      - "bazel-execlogs/**/*"
    depends_on:
      - "bazel-build-test"
      - "mac-app-build"
      - "checks"
    agents:
      queue: "${BUILDKITE_MACOS_QUEUE:-macos-arm64}"
    # Serialize manual and scheduled release runs so a scheduled run never
    # races a manual run's in-progress draft; the later run sees the
    # published release and skips as a no-op.
    concurrency: 1
    concurrency_group: "mono-boss-release"
    retry:
      automatic: false
    notify:
      - github_commit_status:
          context: "buildkite/mono/boss-release"
