# Cube workspace setup steps for the mono repo.
#
# Run by `cube` on every lease against the leased workspace (see
# tools/cube/src/setup.rs). Steps run through `sh -c` with cwd = the
# workspace root; a step that exits non-zero fails the lease, so every step
# must be safe to run on any host cube provisions a mono workspace on.
#
# Leases are time-bounded (the Boss engine budgets ~90s for the whole
# `cube workspace lease`), so no step here may run bazel: a cold workspace
# build blows that budget and fails the lease.
version: 1
steps:
  # Materialize a placeholder GhosttyKit.xcframework so Bazel *analysis* of
  # the macOS app works in a cold workspace. rules_swift_package_manager's
  # swift_deps module extension runs `swift package describe` against
  # tools/boss/app-macos/Package.swift during any analysis — including
  # `bazel mod deps --lockfile_mode=update`, which the deterministic
  # MODULE.bazel.lock conflict resolver shells out to. Package.swift declares
  # a .binaryTarget at ThirdParty/GhosttyKit.xcframework, a gitignored
  # artifact that a freshly provisioned workspace never has, so without this
  # the resolver fails environmentally on every cold workspace. The script is
  # idempotent, never clobbers a real bootstrapped framework, and no-ops off
  # macOS, so `run_when: always` is a cheap file-existence check on leases
  # after the first and self-heals if the stub is ever wiped.
  - id: ghosttykit-spm-stub
    command: bash tools/boss/app-macos/scripts/stub-ghosttykit-xcframework.sh
    run_when: always

  # Populate the gitignored bin/ with repobin shims — one per REPOBIN.toml
  # tool plus `repobin` — so `bin/checkleft` exists in every leased workspace
  # exactly as it does in CI (.buildkite/steps/ci-env.sh runs the real
  # `repobin install --bin-dir bin/`). Each shim builds //tools/repobin:repobin
  # with bazel on first use and dispatches through `repobin exec`, so the
  # checkleft a worker runs is //tools/checkleft:checkleft built from this
  # checkout — the binary CI runs — and never a PATH copy such as an old
  # `cargo install checkleft`. Only symlinks are written here (the bazel
  # build is deferred to first use, see the lease budget note above), so
  # `run_when: always` is free and self-heals a wiped bin/. The installer
  # exits non-zero if bin/checkleft is not executable afterwards, failing
  # the lease loudly rather than handing out a workspace whose checkleft
  # gate a worker would have to improvise.
  - id: repobin-tool-shims
    # boss/boss-event/bossctl/cube are engine-owned launchers, skipped here
    # even though REPOBIN.toml declares them; checkleft is the one tool this
    # repo requires end up executable in bin/ after install (see the
    # installer's header for the generic REPOBIN_SHIM_SKIP/REPOBIN_SHIM_REQUIRE
    # contract this script exposes to any repobin-using checkout).
    command: "REPOBIN_SHIM_SKIP='boss boss-event bossctl cube' REPOBIN_SHIM_REQUIRE='checkleft' bash tools/repobin/shim/install-workspace-shims.sh"
    run_when: always
